# Fix4me — XcodeGen 정의. `scripts/build.sh` 가 이 파일로 Fix4me.xcodeproj 를 생성한다 (xcodeproj 는 커밋하지 않음).
name: Fix4me
options:
  bundleIdPrefix: com.aib
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # 서명은 build.sh 가 고정 개발 인증서로 직접 한다 → 손쉬운 사용 권한이 빌드마다 풀리지 않게
    CODE_SIGNING_ALLOWED: NO
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Fix4me:
    type: application
    platform: macOS
    sources: [Fix4me]
    info:
      path: Fix4me/Info.plist
      properties:
        CFBundleName: Fix4me
        CFBundleDisplayName: Fix4me
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: false         # Dock 아이콘 표시 — 메뉴 막대 아이콘이 가려져도 앱을 찾을 수 있게
        NSHumanReadableCopyright: "© 2026 AIB Inc. — GPL-3.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aib.fix4me
    scheme:
      testTargets: [Fix4meTests]
  Fix4meTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Fix4meTests]
    dependencies:
      - target: Fix4me
